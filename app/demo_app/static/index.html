<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Support Demo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#3b5bdb; --bot:#eef2ff; --err:#c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b1f29; --text:#e6e8ee; --muted:#98a2b3; --line:#2c3240; --accent:#748ffc; --bot:#232a3d; --err:#ff8787; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .meta a { color:var(--accent); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { border:1px solid var(--line); background:var(--card); color:var(--text); padding:6px 12px; border-radius:999px; cursor:pointer; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 12px; }
  #log { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:300px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--bot); }
  .bot.err { color:var(--err); }
  .foot { font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .foot button { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:6px; cursor:pointer; padding:0 6px; }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; min-width:0; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  form button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  .examples { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { font-size:12px; border:1px dashed var(--line); background:transparent; color:var(--muted); border-radius:6px; padding:3px 8px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Acme Outfitters support assistant</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="tabs" id="tabs">
    <button data-mode="chat" class="on">Chat</button>
    <button data-mode="rag">Help center (RAG)</button>
    <button data-mode="agent">Agent with tools</button>
    <button data-mode="error">Trigger an error</button>
  </div>
  <p class="hint" id="hint"></p>
  <div id="log"></div>
  <form id="f"><input id="q" autocomplete="off" placeholder="Ask something…"><button>Send</button></form>
  <div class="examples" id="ex"></div>
</main>
<script>
const HINTS = {
  chat: ["Multi-turn chat. All turns share one session id, so they group together in Phoenix → Sessions.",
         ["What tent would you recommend for a first camping trip?", "And how should I store it?"]],
  rag: ["Retrieves help-center articles, then answers from them. Phoenix shows a RETRIEVER span with the documents and scores.",
        ["How long do I have to return an item?", "Do you ship to Australia?", "What is your stance on cryptocurrency?"]],
  agent: ["A tool-calling loop. Each tool call is a TOOL span in the trace. Order IDs ending in 0 fail on purpose.",
          ["What's the weather in Boulder and what jacket should I bring?", "Where is order A1234?", "Where is order A5550?", "What is 129.99 * 3 - 15?"]],
  error: ["Calls a model that doesn't exist, so the trace in Phoenix shows a failed LLM span.", ["Send anything"]],
};
let mode = "chat";
const session = crypto.randomUUID();
const $ = (id) => document.getElementById(id);

fetch("/health").then(r => r.json()).then(h => {
  $("meta").innerHTML = `Mode: <b>${h.mode}</b> · model ${h.model} · project <b>${h.project}</b> · ` +
    `<a href="${location.protocol}//${location.hostname}:6006" target="_blank" rel="noopener">open Phoenix</a>`;
});

function setMode(m) {
  mode = m;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("hint").textContent = HINTS[m][0];
  $("ex").innerHTML = "";
  HINTS[m][1].forEach(t => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.onclick = () => send(t); $("ex").append(b); });
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode("chat");

function bubble(cls, text) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  $("log").append(d); d.scrollIntoView({block: "end"}); return d;
}

async function send(text) {
  if (!text.trim()) return;
  bubble("user", text);
  const pending = bubble("bot", "…");
  try {
    let res;
    if (mode === "error") res = await fetch("/error");
    else res = await fetch("/" + mode, { method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify(mode === "chat" ? {message: text, session_id: session} : {question: text, session_id: session}) });
    const data = await res.json();
    if (!res.ok) {
      const d = data.detail || {};
      pending.textContent = "Error: " + (d.error || JSON.stringify(d));
      pending.classList.add("err");
      return;
    }
    pending.textContent = data.answer;
    const foot = document.createElement("div"); foot.className = "foot";
    const extra = data.sources ? "sources: " + (data.sources.join(", ") || "none") :
                  data.tools_used ? "tools: " + (data.tools_used.join(", ") || "none") : "";
    foot.innerHTML = `<span>trace ${data.trace_id.slice(0, 8)}… ${extra}</span>`;
    for (const [label, icon] of [["positive", "👍"], ["negative", "👎"]]) {
      const b = document.createElement("button"); b.textContent = icon; b.title = "Send feedback to Phoenix";
      b.onclick = async () => {
        const r = await fetch("/feedback", {method: "POST", headers: {"content-type": "application/json"},
          body: JSON.stringify({span_id: data.span_id, label})});
        foot.querySelectorAll("button").forEach(x => x.disabled = true);
        b.textContent = r.ok ? icon + " sent" : icon + " failed";
      };
      foot.append(b);
    }
    pending.append(foot);
  } catch (e) { pending.textContent = "Error: " + e; pending.classList.add("err"); }
}
$("f").onsubmit = (e) => { e.preventDefault(); const v = $("q").value; $("q").value = ""; send(v); };
</script>
</body>
</html>
